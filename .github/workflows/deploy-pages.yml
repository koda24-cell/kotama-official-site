name: Deploy official site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate site files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s site-config.js
          test -s style.css
          for image in             "assets/イラスト128.1.png"             "assets/イラスト128.2.png"             "assets/イラスト128.3.png"             "assets/characters/kishi.png"             "assets/characters/hi-ra-.png"             "assets/characters/sennshi.png"; do
            test -s "$image" || { echo "::error::Missing or empty: $image"; exit 1; }
          done
      - name: Prepare deployment directory
        shell: bash
        run: |
          mkdir -p _site
          cp index.html site-config.js style.css _site/
          cp -R assets _site/
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
