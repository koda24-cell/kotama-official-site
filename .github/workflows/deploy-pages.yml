name: Deploy official site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate site files
        run: |
          test -s index.html
          test -s site-config.js
          test -s assets/イラスト128.1.png
          test -s assets/イラスト128.2.png
          test -s assets/イラスト128.3.png
          test -s assets/characters/kishi.png
          test -s assets/characters/hi-ra-.png
          test -s assets/characters/sennshi.png
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
